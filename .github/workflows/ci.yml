name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q

  deploy:
    name: Deploy (SSH or PythonAnywhere)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (secrets.SSH_PRIVATE_KEY != '' || secrets.PYTHONANYWHERE_TOKEN != '') }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Remote pull and install
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd ~/rscontas || exit 1
            git fetch --all
            git reset --hard origin/main
            if [ -f .venv/bin/activate ]; then . .venv/bin/activate; fi
            pip install -r requirements.txt || true
          '

      - name: Reload PythonAnywhere (API)
        if: ${{ secrets.PYTHONANYWHERE_TOKEN != '' && secrets.PYTHONANYWHERE_USERNAME != '' && secrets.PYTHONANYWHERE_DOMAIN != '' }}
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_TOKEN }}" \
            https://www.pythonanywhere.com/api/v0/user/${{ secrets.PYTHONANYWHERE_USERNAME }}/webapps/${{ secrets.PYTHONANYWHERE_DOMAIN }}/reload/
